name: 每日健康检查

on:
  schedule:
    - cron: '30 12 * * *'   # 每天 20:30 北京时间
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 检查线上价格数据新鲜度
        id: check
        run: python3 health_check.py

      - name: 异常时创建 Issue 通知
        if: steps.check.outputs.msg != ''
        uses: actions/github-script@v7
        env:
          MSG: ${{ steps.check.outputs.msg }}
        with:
          script: |
            const msg = process.env.MSG;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '价格同步异常告警',
              body: msg + '\n\n（每日健康检查自动生成，非价格问题；请检查后关闭此 Issue）'
            });
