name: 价格自动同步

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖与浏览器
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: 诊断腾讯文档连通性
        run: |
          echo "--- 1. DNS 解析 ---"
          getent hosts docs.qq.com || true
          echo "--- 2. TCP+TLS+HTTP 测试 (30s) ---"
          curl -sS -o /dev/null -w "http_code=%{http_code} time_total=%{time_total}s connect=%{time_connect}s\n" -m 30 https://docs.qq.com/ || echo "curl 失败 exit=$?"
          echo "--- 3. 表格 URL 测试 ---"
          curl -sS -o /dev/null -w "http_code=%{http_code} time_total=%{time_total}s\n" -m 30 "$SHEET_URL" || echo "curl 失败 exit=$?"
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}

      - name: 读取腾讯文档并同步价格
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: python3 sync_sheet.py

      - name: 部署网页
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
