name: 价格自动同步

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖与浏览器
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: 读取腾讯文档并同步价格
        run: python3 sync_sheet.py

      - name: 有变化则提交并推送
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "无价格变化，跳过提交"
          else
            git commit -m "价格同步：$(date '+%Y-%m-%d %H:%M')"
            git push "https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
          fi
