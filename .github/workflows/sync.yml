name: 价格自动同步

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      retry:
        type: boolean
        default: false
        description: 失败补触发的重试标记（自动使用，无需手动）

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖与浏览器
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: 诊断腾讯文档连通性
        run: |
          echo "--- 1. DNS 解析 ---"
          getent hosts docs.qq.com || true
          echo "--- 2. TCP+TLS+HTTP 测试 (30s) ---"
          curl -sS -o /dev/null -w "http_code=%{http_code} time_total=%{time_total}s connect=%{time_connect}s\n" -m 30 https://docs.qq.com/ || echo "curl 失败 exit=$?"
          echo "--- 3. 表格 URL 测试 ---"
          curl -sS -o /dev/null -w "http_code=%{http_code} time_total=%{time_total}s\n" -m 30 "$SHEET_URL" || echo "curl 失败 exit=$?"
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}

      - name: 读取腾讯文档并同步价格
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: python3 sync_sheet.py

      - name: 部署网页
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 发布到 Pages（官方通道）
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 官方发布失败，30 秒后 API 重试（最多 2 次）
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "官方发布失败，改用 API 重试部署..."
          ARTIFACT_ID="${{ steps.upload.outputs.artifact_id }}"
          for i in 1 2; do
            sleep 30
            CODE=$(curl -s -o /tmp/deploy_resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "{\"artifact_id\":\"$ARTIFACT_ID\"}" \
              "https://api.github.com/repos/Acssxiaolei/pld-price/pages/deployments")
            echo "API 重试第 ${i} 次 HTTP $CODE"
            if [ "$CODE" = "201" ] || [ "$CODE" = "200" ]; then
              echo "API 重试部署成功"
              exit 0
            fi
          done
          echo "API 重试仍失败，交由最外层补触发兜底"
          exit 1

      - name: 失败后 60 秒自动补触发一次（仅非重试 run）
        if: failure() && github.event.inputs.retry != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "同步失败，60 秒后自动补触发一次（重试标记 run）..."
          sleep 60
          curl -s -o /dev/null -w "补触发 HTTP %{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main","inputs":{"retry":"true"}}' \
            "https://api.github.com/repos/Acssxiaolei/pld-price/actions/workflows/sync.yml/dispatches"
